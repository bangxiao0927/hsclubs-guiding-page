name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  poller:
    name: poller and page server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The shared v1 artifact, before anything that depends on it: a schema edit that breaks a
      # pinned fixture is a cross-repository break, not a local one.
      - run: npm run contracts:check
      - run: npm test

  web:
    name: browser app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      # The build is part of CI because a type error in a component would otherwise only surface
      # on the machine that deploys it.
      - run: npm run build
        working-directory: web
